version: 2
updates:
  # npm (PlanVisualizer tooling)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - javascript

  # Swift Package Manager
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - swift
