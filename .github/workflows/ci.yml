name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JavaScript: Lint ────────────────────────────────────────────────────────
  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

  # ── JavaScript: Test & Coverage Gate ───────────────────────────────────────
  test-coverage:
    name: Jest (80% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run plan:test:coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Swift: Lint ─────────────────────────────────────────────────────────────
  lint-swift:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        # --strict omitted: upstream code has style warnings (trailing_comma,
        # opening_brace, etc.) that are not our changes. Only error-level
        # violations (configured in .swiftlint.yml) will fail this step.
        run: swiftlint lint --reporter github-actions-logging

  # ── Swift: Build ────────────────────────────────────────────────────────────
  build-swift:
    name: Xcode Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project iCloudMCP.xcodeproj -scheme iCloudMCP

      - name: Build (Debug)
        run: |
          xcodebuild build \
            -project iCloudMCP.xcodeproj \
            -scheme iCloudMCP \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild build \
            -project iCloudMCP.xcodeproj \
            -scheme iCloudMCP \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO
