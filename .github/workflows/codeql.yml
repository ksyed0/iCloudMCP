name: CodeQL Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 09:00 UTC regardless of commits
    - cron: '0 9 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        language: [swift, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Select Xcode (Swift only)
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode.app

      # JavaScript: autobuild is fine.
      - name: Autobuild (JavaScript)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@v3

      # Swift: autobuild fails with "no-swift-target" because the CodeQL
      # autobuilder doesn't detect mixed-target Xcode projects reliably.
      # Build both targets explicitly so CodeQL traces the compiler invocations.
      - name: Manual build (Swift)
        if: matrix.language == 'swift'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iCloudMCP.xcodeproj \
            -scheme iCloudMCP
          xcodebuild build \
            -project iCloudMCP.xcodeproj \
            -scheme iCloudMCP \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
